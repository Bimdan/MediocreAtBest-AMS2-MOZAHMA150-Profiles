name: Validate package
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate profile files, manifests and database
        run: python tests/check_package.py
      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          foreach ($file in @('Tools/SetupEngine.ps1', 'Tools/RecoveryEngine.ps1', 'tests/restore-fixtures.ps1', 'tests/upgrade-fixtures.ps1', 'tests/database-fixtures.ps1')) {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if (@($parseErrors).Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $file, $_.Extent.StartLineNumber, $_.Message) }
              throw "PowerShell syntax validation failed: $file"
            }
          }
      - name: Non-destructive restore fixture tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\restore-fixtures.ps1
      - name: Non-destructive installed-profile replacement and rollback scenarios (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\upgrade-fixtures.ps1
      - name: Native SQLite delta insertion and database restore
        shell: powershell
        run: .\tests\database-fixtures.ps1
